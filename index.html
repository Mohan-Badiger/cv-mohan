<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Theme Colors -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <!-- Preconnect & DNS Prefetch (Google Fonts Performance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://mohanbadiger.info" />

    <!-- Primary SEO Title -->
    <title>
      Mohan Badiger | MERN Stack Developer in Karnataka | React & Next.js
    </title>

    <!-- Meta Description -->
    <meta
      name="description"
      content="Professional resume of Mohan S Badiger – MERN Stack Developer with expertise in React.js, Node.js, MongoDB and scalable web applications. Explore technical skills, project experience and career profile."
    />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="Mohan Badiger, Mohan, Mohan S Badiger, MERN Developer Karnataka, React Developer Bengaluru, Node.js Developer India, Full Stack Developer Portfolio, Developer near me"
    />

    <meta name="author" content="Mohan S Badiger" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (For Social Sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mohan Badiger | MERN Stack Developer" />
    <meta
      property="og:description"
      content="Explore the portfolio of Mohan S Badiger – React, Node.js & MERN Stack Developer from Karnataka."
    />
    <meta property="og:url" content="https://mohanbadiger.info" />
    <meta property="og:image" content="https://mohanbadiger.info/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mohan Badiger | MERN Developer" />
    <meta
      name="twitter:description"
      content="Portfolio website of Mohan Badiger – Full Stack MERN Developer."
    />
    <meta name="twitter:image" content="https://mohanbadiger.info/logo.png" />

    <!-- Structured Data (Schema Markup) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Mohan Badiger",
        "url": "https://mohanbadiger.info",
        "jobTitle": "MERN Stack Developer",
        "sameAs": [
          "https://github.com/Mohan-Badiger",
          "https://linkedin.com/in/mohan-badiger"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
